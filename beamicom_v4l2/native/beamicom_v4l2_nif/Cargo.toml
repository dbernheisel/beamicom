[package]
name = "beamicom_v4l2_nif"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
rustler = { version = "0.38", default-features = false, features = ["derive", "nif_version_2_15"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
